name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest

  ios-simulator:
    name: Build para el simulador de iOS
    # Manual: Actions → CI → Run workflow. Builds an unsigned .app for the iOS simulator.
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean
      - name: Compilar
        run: |
          xcodebuild \
            -workspace ios/Notas.xcworkspace \
            -scheme Notas \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Empaquetar
        run: cd build/Build/Products/Release-iphonesimulator && zip -r "$GITHUB_WORKSPACE/Notas-simulador.zip" Notas.app
      - uses: actions/upload-artifact@v4
        with:
          name: Notas-simulador
          path: Notas-simulador.zip
