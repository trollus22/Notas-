name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest

  ios-ipa:
    name: IPA sin firmar
    # Se ejecuta en cada push y a mano desde Actions → CI → Run workflow.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Generar el proyecto de iOS
        run: npx expo prebuild --platform ios --clean
      - name: Compilar para iPhone sin firmar
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Notas.xcworkspace \
            -scheme Notas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 80
      - name: Empaquetar el IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Notas.app Payload/
          zip -qry Notas-sin-firmar.ipa Payload
          ls -lh Notas-sin-firmar.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Notas-sin-firmar
          path: Notas-sin-firmar.ipa
